version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: safescan_db
    environment:
      POSTGRES_USER: safescan
      POSTGRES_PASSWORD: safescan
      POSTGRES_DB: safescan_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safescan"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: safescan_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://safescan:safescan@db:5432/safescan_db
      SECRET_KEY: dev_secret_key_change_in_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      APP_ENV: development
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
