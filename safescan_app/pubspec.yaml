name: safescan_app
description: SafeScan and PackCheck AI mobile application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  material_ui: ^1.11.1
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.4
  google_fonts: ^6.3.2
  flutter_secure_storage: ^9.2.4
  mobile_scanner: ^7.1.3
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  share_plus: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
