[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safescan-engines"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "rapidfuzz>=3.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "reportlab>=4.0",
]

[project.optional-dependencies]
ocr = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "paddlepaddle",
  "paddleocr",
  "pytesseract",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["safescan_engines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"